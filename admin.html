<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng điều hành EchoKid</title>
<meta name="description" content="Trang điều hành EchoKid: ca cảnh báo an toàn, yêu cầu chuyên gia, điều khiển AI, chi phí Gemini và Firestore, nhật ký kiểm tra.">
<link rel="icon" href="assets/echokid-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="css/tokens.css">
<!-- Tailwind v4 in the browser: no build step, so the prototype still opens from file:// -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  /* utilities read the EchoKid tokens, so light/dark switching stays in css/tokens.css */
  @theme inline {
    --font-sans: var(--font-body);
    --font-brand: var(--font-display);
    --color-bg: var(--bg);
    --color-surface: var(--surface);
    --color-surface-2: var(--surface-2);
    --color-surface-3: var(--surface-3);
    --color-line: var(--line);
    --color-line-strong: var(--line-strong);
    --color-control: var(--control);
    --color-ink: var(--ink);
    --color-ink-2: var(--ink-2);
    --color-ink-3: var(--ink-3);
    --color-primary: var(--primary);
    --color-primary-hover: var(--primary-hover);
    --color-on-primary: var(--on-primary);
    --color-primary-tint: var(--primary-tint);
    --color-primary-ink: var(--primary-ink);
    --color-teal: var(--teal);
    --color-teal-tint: var(--teal-tint);
    --color-peach-tint: var(--peach-tint);
    --color-peach-ink: var(--peach-ink);
    --color-good: var(--good);
    --color-good-tint: var(--good-tint);
    --color-good-line: var(--good-line);
    --color-warn: var(--warn);
    --color-warn-tint: var(--warn-tint);
    --color-warn-line: var(--warn-line);
    --color-crit: var(--crit);
    --color-crit-tint: var(--crit-tint);
    --color-crit-line: var(--crit-line);
    --color-crit-btn: var(--crit-btn);
    --color-crit-btn-hover: var(--crit-btn-hover);
    --color-on-crit: var(--on-crit);
    --color-scrim: var(--scrim);
    --color-proto: var(--proto-bg);
    --color-proto-ink: var(--proto-ink);
    --color-grid: var(--chart-grid);
    --color-axis: var(--chart-axis);
    --color-brand-echo: var(--brand-echo);
    --color-brand-kid: var(--brand-kid);
    --shadow-card: var(--shadow-1);
    --shadow-pop: var(--shadow-2);
    --animate-drawer: drawer-in 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    --animate-pop: pop-in 0.18s ease-out;
    --animate-fade: fade-in 0.18s ease-out;
  }
  @keyframes drawer-in { from { transform: translateX(32px); opacity: 0; } }
  @keyframes pop-in { from { transform: translateY(8px) scale(0.98); opacity: 0; } }
  @keyframes fade-in { from { opacity: 0; } }

  @layer base {
    html { font-family: var(--font-body); -webkit-text-size-adjust: 100%; }
    body { background: var(--bg); color: var(--ink); }
    .icon { width: 1.25em; height: 1.25em; flex-shrink: 0; }
    :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button:not(:disabled), [role="button"], summary, select { cursor: pointer; }
    input[type="search"]::-webkit-search-cancel-button { cursor: pointer; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body class="min-h-screen bg-bg text-ink antialiased">
<div id="app"></div>
<noscript><p style="padding:24px;font-family:system-ui">Trang điều hành cần bật JavaScript.</p></noscript>

<script src="js/shared/dev-errors.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.umd.js"></script>

<!-- shared with the parent app: helpers, icons, theme switch, and the state both apps read (prototype bridge) -->
<script src="js/shared/core.js"></script>
<script src="js/shared/bridge.js"></script>

<!-- cost model and seeded sample usage, reused from the first console -->
<script src="js/admin/pricing.js"></script>
<script src="js/admin/data.js"></script>

<!-- moderator console -->
<script src="js/console/ui.js"></script>
<script src="js/console/charts.js"></script>
<script src="js/console/store.js"></script>
<script src="js/console/pages-monitor.js"></script>
<script src="js/console/pages-support.js"></script>
<script src="js/console/pages-ops.js"></script>
<script src="js/console/pages-team.js"></script>
<script src="js/console/shell.js"></script>
<script src="js/console/main.js"></script>
</body>
</html>
